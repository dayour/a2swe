[package]
name = "a2swe-desktop"
version = "0.1.0"
description = "Native a2swe agent console"
authors = ["a2swe"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
