    - article [ref=e4]:
      - paragraph [ref=e5]: Platform and SRE engineers
      - heading "Datadog for Claude Cowork. Observability by conversation." [level=1] [ref=e6]
      - paragraph [ref=e7]: The Datadog plugin and connector let Claude query Datadog logs, metrics, traces, dashboards and monitors through the Datadog MCP Server.
      - paragraph [ref=e8]:
        - strong [ref=e9]: "Decision:"
        - text: Pilot the Datadog connector with one team, keep Datadog permissions scoped, and treat the Preview status as a rollout risk.
    - generic [ref=e10]:
      - region [ref=e11]:
        - paragraph [ref=e12]: Section 1
        - heading "A bridge. Not a dashboard." [level=2] [ref=e13]
        - paragraph [ref=e14]: The Datadog MCP Server links your observability data to any agent that speaks the Model Context Protocol, so you ask instead of clicking through screens.
        - heading "Supported claims" [level=3] [ref=e15]
        - list [ref=e16]:
          - listitem [ref=e17]:
            - text: The Datadog MCP Server bridges Datadog observability data to AI agents, so logs, metrics, traces, dashboards and monitors can be queried in natural language.
            - link "Citation ev-01" [ref=e18] [cursor=pointer]:
              - /url: "#ev-01"
              - text: "[ev-01]"
            - link "Citation ev-02" [ref=e19] [cursor=pointer]:
              - /url: "#ev-02"
              - text: "[ev-02]"
