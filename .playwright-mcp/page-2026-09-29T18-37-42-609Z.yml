      - region [ref=e46]:
        - paragraph [ref=e47]: Section 3
        - heading "Set up. Pick a site, sign in." [level=2] [ref=e48]
        - paragraph [ref=e49]: Choose your Datadog site and sign in with OAuth. Keys are supported, and older manual servers or custom connectors should be removed first.
        - heading "Supported claims" [level=3] [ref=e50]
        - list [ref=e51]:
          - listitem [ref=e52]:
            - text: Setup asks you to choose a Datadog site and sign in with OAuth in the browser; API and application keys are a supported alternative.
            - link "Citation ev-07" [ref=e53] [cursor=pointer]:
              - /url: "#ev-07"
              - text: "[ev-07]"
            - link "Citation ev-08" [ref=e54] [cursor=pointer]:
              - /url: "#ev-08"
              - text: "[ev-08]"
          - listitem [ref=e55]:
            - text: Remove any separately registered Datadog MCP server or custom connector first to avoid conflicts.
            - link "Citation ev-14" [ref=e56] [cursor=pointer]:
              - /url: "#ev-14"
              - text: "[ev-14]"
            - link "Citation ev-15" [ref=e57] [cursor=pointer]:
