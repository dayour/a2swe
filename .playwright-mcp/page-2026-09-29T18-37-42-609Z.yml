      - region [ref=e66]:
        - paragraph [ref=e67]: Section 4
        - heading "Access. Your permissions still apply." [level=2] [ref=e68]
        - paragraph [ref=e69]: You need Datadog permissions for the resources you query, and no Datadog credentials are sent to the model provider.
        - heading "Supported claims" [level=3] [ref=e70]
        - list [ref=e71]:
          - listitem [ref=e72]:
            - text: You need Datadog permissions for the resources you query, and the plugin states that no Datadog credentials are sent to the AI model provider.
