      - region [ref=e28]:
        - paragraph [ref=e29]: Section 2
        - heading "Where it runs. Cowork and Claude Code." [level=2] [ref=e30]
        - paragraph [ref=e31]: Claude, including Cowork, uses the official connector. Claude Code installs the plugin from the official Anthropic marketplace.
        - heading "Supported claims" [level=3] [ref=e32]
        - list [ref=e33]:
          - listitem [ref=e34]:
            - text: For Claude, including Claude Cowork, the official Datadog connector is the recommended path and includes MCP Apps for in-product visualizations.
            - link "Citation ev-05" [ref=e35] [cursor=pointer]:
              - /url: "#ev-05"
              - text: "[ev-05]"
          - listitem [ref=e36]:
            - text: Claude Code installs the Datadog plugin from the official Anthropic Plugin Marketplace; the plugin bundles the MCP Server with skills and auto-updates.
            - link "Citation ev-06" [ref=e37] [cursor=pointer]:
              - /url: "#ev-06"
              - text: "[ev-06]"
        - complementary "Assets for Where it runs. Cowork and Claude Code." [ref=e38]:
          - heading "Assets" [level=3] [ref=e39]
