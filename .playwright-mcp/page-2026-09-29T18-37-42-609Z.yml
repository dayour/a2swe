      - region [ref=e83]:
        - paragraph [ref=e84]: Section 5
        - heading "Control. Choose the toolsets." [level=2] [ref=e85]
        - paragraph [ref=e86]: Enable or disable groups of MCP tools so the agent sees only the Datadog products your team needs.
        - heading "Supported claims" [level=3] [ref=e87]
        - list [ref=e88]:
          - listitem [ref=e89]:
            - text: Groups of MCP tools can be enabled or disabled with the toolsets command.
            - link "Citation ev-11" [ref=e90] [cursor=pointer]:
              - /url: "#ev-11"
              - text: "[ev-11]"
        - group [ref=e91]:
          - generic "Speaker notes" [ref=e92]
      - region [ref=e93]:
        - paragraph [ref=e94]: Section 6
        - heading "Risk. Preview, compliance, site limits." [level=2] [ref=e95]
        - paragraph [ref=e96]: The plugin is in Preview. The server is HIPAA-eligible, but you own compliance for connected tools, and the government sites are unsupported.
        - heading "Supported claims" [level=3] [ref=e97]
        - list [ref=e98]:
          - listitem [ref=e99]:
            - text: The Datadog plugin and its marketplace listing are in Preview.
            - link "Citation ev-03" [ref=e100] [cursor=pointer]:
              - /url: "#ev-03"
              - text: "[ev-03]"
            - link "Citation ev-04" [ref=e101] [cursor=pointer]:
              - /url: "#ev-04"
              - text: "[ev-04]"
          - listitem [ref=e102]:
            - text: The Datadog MCP Server is HIPAA-eligible, customers remain responsible for the compliance of the AI tools they connect, and the server is not supported on the Datadog government sites.
            - link "Citation ev-12" [ref=e103] [cursor=pointer]:
              - /url: "#ev-12"
              - text: "[ev-12]"
            - link "Citation ev-13" [ref=e104] [cursor=pointer]:
